<!DOCTYPE html>
<html>
<head>
    <title>Teste Funcionalidades Quilombo Laboratório</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
</head>
<body>
    <h1>Teste das Funcionalidades</h1>
    
    <div id="resultado"></div>
    
    <script>
        function testarFuncionalidades() {
            let resultados = [];
            
            // Teste 1: jQuery
            resultados.push('jQuery: ' + (typeof jQuery !== 'undefined' ? '✅ OK' : '❌ ERRO'));
            
            // Teste 2: jQuery UI Sortable
            resultados.push('jQuery UI Sortable: ' + (typeof jQuery.fn.sortable !== 'undefined' ? '✅ OK' : '❌ ERRO'));
            
            document.getElementById('resultado').innerHTML = resultados.join('<br>');
        }
        
        // Executar teste quando carregar
        $(document).ready(function() {
            testarFuncionalidades();
        });
    </script>
</body>
</html>
